# Baut die Produktions-Images (App + Migrationen) und legt sie in der GitHub
# Container Registry ab, damit kleine Server sie nur noch ziehen müssen.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Name (Kleinbuchstaben)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medinetz" >> "$GITHUB_OUTPUT"

      - name: App-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrations-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.image.outputs.name }}:migrate
          cache-from: type=gha
